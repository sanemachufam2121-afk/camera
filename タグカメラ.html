<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>タグカメラ</title>
<style>
:root{--bg:#14161a;--fg:#f2f2ee;--sub:#8b909a;--tag:#ffb020;--rec:#ff4538;box-sizing:border-box}
*{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
#stage{position:relative;aspect-ratio:3/4;background:#000;border-radius:14px;overflow:hidden}
#preview{width:100%;height:100%;object-fit:cover}
#clock{position:absolute;top:10px;left:12px;font:600 15px ui-monospace,monospace;background:#0008;padding:3px 9px;border-radius:99px}
#clock.on::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rec);margin-right:6px}
#flash{position:absolute;inset:0;background:var(--tag);opacity:0;pointer-events:none;transition:opacity .4s}
#flash.on{opacity:.35;transition:none}
.cfg{display:flex;gap:16px;margin:12px 2px;color:var(--sub);font-size:14px}
select{background:#23262c;color:var(--fg);border:1px solid #343840;border-radius:8px;padding:5px 8px;font-size:15px}
.bar{display:flex;align-items:center;justify-content:center;gap:28px;margin:8px 0 6px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#rec{width:76px;height:76px;border-radius:50%;background:transparent;border:4px solid var(--fg);position:relative}
#rec::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--rec);transition:.15s}
#rec.on::after{inset:20px;border-radius:8px}
#tag{height:76px;padding:0 30px;border-radius:38px;background:var(--tag);color:#1a1200;font-weight:800;font-size:20px}
#tag:disabled{background:#2a2d33;color:#5d626b}
#status{min-height:1.4em;text-align:center;color:var(--sub);font-size:14px}
#tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{background:#2a2410;color:var(--tag);border-radius:99px;padding:3px 10px;font:600 13px ui-monospace,monospace}
h2{font-size:16px;margin:22px 2px 8px}
.item{display:flex;gap:12px;align-items:center;background:#1d2025;border-radius:12px;padding:10px;margin-bottom:8px}
.item video{width:96px;height:72px;object-fit:cover;border-radius:8px;background:#000}
.item b{display:block;font-size:15px}.item small{color:var(--sub)}
.item button{margin-left:auto;background:#2f333a;border-radius:8px;padding:9px 14px;font-size:14px}
</style>
</head>
<body>
<main>
  <div id="stage">
    <video id="preview" autoplay muted playsinline></video>
    <div id="clock">00:00</div>
    <div id="flash"></div>
  </div>
  <div class="cfg">
    <label>タグの前後 <select id="len"></select> 秒ずつ</label>
    <label>画質 <select id="res"><option value="720">720p</option><option value="1080" selected>1080p</option><option value="4k">4K</option></select></label>
  </div>
  <div id="avail" class="cfg" style="margin-top:-4px"></div>
  <div class="bar">
    <button id="rec" aria-label="撮影の開始と終了"></button>
    <button id="tag" disabled>タグ</button>
  </div>
  <div id="status">撮影ボタンでカメラを起動します</div>
  <div id="tags"></div>
  <h2>保存した動画</h2>
  <div id="list"></div>
</main>
<script>
const $ = id => document.getElementById(id);
for (let i = 7; i <= 10; i++) $('len').add(new Option(i, i, i === 7, i === 7));

let stream, rec, chunks = [], t0 = 0, tags = [], timer, mime = '';
const pickMime = () => ['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']
  .find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
const ext = () => mime.includes('mp4') ? 'mp4' : 'webm';
const mmss = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(Math.floor(s%60)).padStart(2,'0');
const say = t => $('status').textContent = t;
const stamp = () => { const d = new Date(), p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; };

const RES = { '720': { w: 1280, h: 720, bps: 5e6 }, '1080': { w: 1920, h: 1080, bps: 8e6 }, '4k': { w: 3840, h: 2160, bps: 25e6 } };
const cur = () => RES[$('res').value];
let availSecs = 0;
const fmtT = s => s >= 3600 ? `${Math.floor(s/3600)}時間${Math.floor(s%3600/60)}分` : `${Math.floor(s/60)}分${Math.floor(s%60)}秒`;

// 撮影可能時間の目安: 空き容量と、端末メモリの1/4(撮影中は動画をメモリに保持するため)の小さい方
async function calcAvail() {
  const bytesPerSec = cur().bps / 8;
  let free = Infinity;
  try { const e = await navigator.storage.estimate(); free = e.quota - e.usage; } catch (e) {}
  const memCap = (navigator.deviceMemory || 4) * 1e9 * 0.25;
  return Math.max(0, Math.min(free, memCap) / bytesPerSec);
}
async function showAvail() {
  if (rec && rec.state === 'recording') return;
  availSecs = await calcAvail();
  $('avail').textContent = `撮影可能時間の目安: 約${fmtT(availSecs)}`;
}
$('res').onchange = showAvail; showAvail();

async function start() {
  const q = cur();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: q.w }, height: { ideal: q.h } }, audio: true });
  } catch (e) { say('カメラとマイクの許可が必要です(HTTPSで開いてください)'); return; }
  $('preview').srcObject = stream;
  mime = pickMime();
  rec = new MediaRecorder(stream, { ...(mime ? { mimeType: mime } : {}), videoBitsPerSecond: q.bps });
  mime = rec.mimeType || mime;
  availSecs = await calcAvail();
  const s = stream.getVideoTracks()[0].getSettings();
  $('res').disabled = true;
  chunks = []; tags = []; $('tags').innerHTML = '';
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = finish;
  rec.start(1000);
  t0 = performance.now();
  timer = setInterval(() => {
    const el = (performance.now() - t0) / 1000, left = availSecs - el;
    $('clock').textContent = mmss(el);
    $('avail').textContent = `残り撮影可能時間の目安: 約${fmtT(Math.max(0, left))}`;
    if (left <= 0) { say('容量の上限に達したため自動で終了しました'); stop(); }
  }, 250);
  $('clock').classList.add('on'); $('rec').classList.add('on'); $('tag').disabled = false;
  say(`撮影中 ${s.width}×${s.height}。残したい場面でタグを押してください`);
}

function addTag() {
  const t = (performance.now() - t0) / 1000;
  tags.push({ t, pre: +$('len').value, post: +$('len').value });
  const c = document.createElement('span'); c.className = 'chip'; c.textContent = mmss(t);
  $('tags').append(c);
  $('flash').classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => $('flash').classList.remove('on')));
  if (navigator.vibrate) navigator.vibrate(30);
}

function stop() {
  clearInterval(timer);
  $('clock').classList.remove('on'); $('rec').classList.remove('on'); $('tag').disabled = true;
  $('rec').disabled = true;
  rec.stop();
}

async function finish() {
  const total = (performance.now() - t0) / 1000;
  stream.getTracks().forEach(t => t.stop()); $('preview').srcObject = null;
  const full = new Blob(chunks, { type: mime });
  addItem(full, `全編 ${stamp()}`, mmss(total));
  for (let i = 0; i < tags.length; i++) {
    const g = tags[i], a = Math.max(0, g.t - g.pre), b = Math.min(total, g.t + g.post);
    say(`タグ ${i+1}/${tags.length} を切り出し中(${Math.round(b - a)}秒かかります)`);
    try { addItem(await cut(full, a, b), `タグ${i+1} ${mmss(g.t)}`, `${mmss(a)}〜${mmss(b)}`); }
    catch (e) { say('切り出しに失敗しました: ' + e.message); }
  }
  say('保存できます。撮影ボタンでもう一度撮影');
  $('rec').disabled = false; $('res').disabled = false; showAvail();
}

// 全編動画の一部を再生しながら録画し直して、クリップを作る
async function cut(blob, a, b) {
  const v = document.createElement('video');
  v.src = URL.createObjectURL(blob); v.playsInline = true; v.preload = 'auto';
  await new Promise((ok, ng) => { v.onloadedmetadata = ok; v.onerror = () => ng(new Error('読み込めません')); });
  if (!isFinite(v.duration)) {  // webmは長さ情報がないため、末尾へ移動して取得
    v.currentTime = 1e101;
    await new Promise(ok => v.ontimeupdate = () => { v.ontimeupdate = null; ok(); });
  }
  v.currentTime = a;
  await new Promise(ok => v.onseeked = () => { v.onseeked = null; ok(); });

  const cv = document.createElement('canvas'); cv.width = v.videoWidth; cv.height = v.videoHeight;
  const ctx2d = cv.getContext('2d');
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const dest = ac.createMediaStreamDestination();
  ac.createMediaElementSource(v).connect(dest);
  const out = cv.captureStream(30);
  dest.stream.getAudioTracks().forEach(t => out.addTrack(t));
  const r = new MediaRecorder(out, { ...(mime ? { mimeType: mime } : {}), videoBitsPerSecond: cur().bps }), parts = [];
  r.ondataavailable = e => e.data.size && parts.push(e.data);
  const done = new Promise(ok => r.onstop = ok);
  let live = true;
  const draw = () => { if (!live) return; ctx2d.drawImage(v, 0, 0, cv.width, cv.height);
    if (v.currentTime >= b || v.ended) { live = false; v.pause(); r.stop(); } else requestAnimationFrame(draw); };
  r.start(500); await ac.resume(); await v.play(); draw();
  await done; ac.close(); URL.revokeObjectURL(v.src);
  return new Blob(parts, { type: mime });
}

function addItem(blob, title, sub) {
  const url = URL.createObjectURL(blob), name = `${title.replace(/[ :〜]/g, '_')}.${ext()}`;
  const el = document.createElement('div'); el.className = 'item';
  el.innerHTML = `<video src="${url}#t=0.1" muted playsinline controls></video><div><b>${title}</b><small>${sub}</small></div><button>保存</button>`;
  el.querySelector('button').onclick = async () => {
    try {
      const dl = window.claude && await window.claude.use('downloads');
      if (dl) { await dl.save({ filename: name, data: blob }); return; }
    } catch (e) { if (e && e.code === 'declined') return; }
    const f = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f] }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  };
  $('list').prepend(el);
}

$('rec').onclick = () => (rec && rec.state === 'recording') ? stop() : start();
$('tag').onclick = addTag;
</script>
</body>
</html>
